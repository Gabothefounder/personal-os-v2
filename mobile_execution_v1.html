<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Personal OS - Execution</title>
  <style>
    :root {
      font-size: 32px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    html, body {
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      font-size: 1rem !important;
      line-height: 1.5 !important;
      overflow-x: hidden;
    }

    button {
      font-size: 1rem !important;
    }

    .header, .view-title, h1, h2, .title {
      font-size: 1.1rem !important;
    }

    .counter, .helper {
      font-size: 0.9rem !important;
    }

    .header {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 500;
      color: #666;
      position: relative;
      flex-shrink: 0;
    }

    .back-button {
      position: absolute;
      left: 0;
      background: none;
      border: none;
      font-size: 24px;
      color: #1a1a1a;
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    .task-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px 0;
    }

    .task-item {
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .task-content {
      font-size: 1rem !important;
      line-height: 1.6;
      color: #1a1a1a;
      margin-bottom: 16px;
    }

    .task-actions {
      display: flex;
      gap: 12px;
    }

    .task-actions button {
      flex: 1;
      min-height: 90px !important;
      height: 90px !important;
      font-weight: 500;
      border: none;
      border-radius: 16px !important;
      cursor: pointer;
      padding: 28px 24px !important;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    .task-actions button.done {
      background: #3a3a3a;
      color: #ffffff;
    }

    .task-actions button.done:active {
      background: #2c2c2c;
    }

    .task-actions button.cancel {
      background: #666;
      color: #ffffff;
    }

    .task-actions button.cancel:active {
      background: #555;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #666;
      font-size: 1rem !important;
    }

    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      background: #2c2c2c;
      color: #ffffff;
      padding: 16px 24px;
      border-radius: 12px;
      display: none;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .toast.show {
      display: block;
      animation: fadeInOut 1.2s;
    }

    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
      10% { opacity: 1; transform: translateX(-50%) translateY(0); }
      90% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
    }

    @media (min-width: 900px) {
      body {
        display: flex;
        justify-content: center;
        background: #f5f5f5;
      }

      .task-list {
        max-width: 720px;
        width: 100%;
        margin: 0 auto;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <button class="back-button" onclick="goToCapture()">← Back</button>
    <div>Execution</div>
  </div>
  <div class="task-list" id="task-list">
    <div class="empty-state">Loading...</div>
  </div>
  <div id="toast" class="toast"></div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzDnoBDowi3U_H3olPqPuLtO-bJaLoYrsjp4ZONdO9_6zim1ajZfQzYigDiY-EYTTba/exec";

    const taskList = document.getElementById('task-list');
    const toast = document.getElementById('toast');

    function goToCapture() {
      window.location.href = API_URL;
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 1200);
    }

    async function callApi(action, payload = {}) {
      const url = API_URL + `?api=1&action=${action}&payload=` + encodeURIComponent(JSON.stringify(payload));
      const res = await fetch(url);
      const data = await res.json();

      if (!res.ok || data.ok === false) {
        throw new Error(data.error || "API error");
      }

      return data;
    }

    async function loadTasks() {
      try {
        const data = await callApi("list_open_tasks", {});
        const tasks = Array.isArray(data) ? data : [];
        renderTasks(tasks);
      } catch (error) {
        taskList.innerHTML = '<div class="empty-state">Error loading tasks</div>';
      }
    }

    function renderTasks(tasks) {
      if (tasks.length === 0) {
        taskList.innerHTML = '<div class="empty-state">No open tasks</div>';
        return;
      }

      taskList.innerHTML = tasks.map(task => `
        <div class="task-item" data-task-id="${task.task_id}">
          <div class="task-content">${escapeHtml(task.content || '')}</div>
          <div class="task-actions">
            <button class="done" onclick="completeTask('${task.task_id}')">Done</button>
            <button class="cancel" onclick="cancelTask('${task.task_id}')">Cancel</button>
          </div>
        </div>
      `).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function completeTask(taskId) {
      try {
        await callApi("complete_task", { task_id: taskId });
        showToast("Task completed");
        await loadTasks();
      } catch (error) {
        showToast("Error: " + error.message);
      }
    }

    async function cancelTask(taskId) {
      try {
        await callApi("cancel_task", { task_id: taskId });
        showToast("Task canceled");
        await loadTasks();
      } catch (error) {
        showToast("Error: " + error.message);
      }
    }

    loadTasks();
  </script>
</body>
</html>
