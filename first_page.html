<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    /* ============================
       MOBILE-FIRST BASE STYLES
       ============================ */

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f5f5;
      color: #111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    header {
      flex-shrink: 0;
      padding: 16px;
      border-bottom: 1px solid #ddd;
      background: #fafafa;
    }

    header h1 {
      font-size: 20px !important;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #333;
      margin: 0;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    main {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 12px;
    }

    textarea {
      width: 100%;
      padding: 28px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      border: 2px solid #cfcfcf;
      border-radius: 14px;
      resize: none;
      flex: 1;
      min-height: 240px;
    }

    textarea::placeholder {
      color: #999;
      opacity: 1;
    }

    textarea:focus {
      outline: none;
      border-color: #555;
    }

    .counter {
      flex-shrink: 0;
      margin-top: 8px;
      font-size: 16px !important;
      color: #666;
      text-align: right;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    .actions {
      position: sticky;
      bottom: 0;
      background: #ffffff;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-top: 1px solid #d0d0d0;
    }

    .actions button {
      width: 100%;
      padding: 26px;
      font-weight: 600;
      border-radius: 14px;
      background: #1f1f1f;
      color: #ffffff;
      border: none;
    }

    .actions button.secondary {
      background: #444;
    }

    .actions button:active {
      background: #000;
    }

    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-content {
      background: #fff;
      padding: 20px;
      width: 90%;
      max-width: 480px;
      border-radius: 12px;
    }

    .modal-content h2 {
      font-size: 16px;
      margin-bottom: 12px;
    }

    .modal-content input,
    .modal-content select,
    .modal-content textarea {
      width: 100%;
      margin-bottom: 12px;
      padding: 10px;
      font-size: 16px;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }

    .confirmation {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #222;
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
      display: none;
      z-index: 2000;
    }

    /* ============================
       DESKTOP OVERRIDES
       ============================ */

    @media (min-width: 900px) {
      body {
        max-width: 900px;
        margin: 0 auto;
        border-left: 1px solid #ddd;
        border-right: 1px solid #ddd;
      }

      header h1 {
        font-size: 14px !important;
      }

      textarea {
        font-size: 20px;
      }

      .counter {
        font-size: 14px !important;
      }

      .actions {
        flex-direction: row !important;
        padding: 16px;
      }

      .actions button {
        width: auto !important;
        flex: 1;
        min-height: 66px !important;
        height: 66px !important;
        font-size: 18px !important;
      }
    }

    @media (max-width: 768px) {
      header h1 {
        font-size: 18px !important;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>INTAKE</h1>
</header>

<main>
  <textarea
    id="input"
    maxlength="800"
    placeholder="Capture first. Decide after. Nothing is inferred."
    style="
      font-size: 28px;
      line-height: 1.6;
      padding: 24px;
    "></textarea>
  <div class="counter"><span id="count">0</span> / 800</div>
</main>

<div class="actions">
  <button onclick="saveRaw()" style="
    font-size: 24px;
    padding: 28px;
    min-height: 84px;
  ">RAW</button>
  <button onclick="saveInbox()" style="
    font-size: 24px;
    padding: 28px;
    min-height: 84px;
  ">INBOX</button>
  <button class="secondary" onclick="openPerson()" style="
    font-size: 24px;
    padding: 28px;
    min-height: 84px;
  ">PERSON</button>
  <button class="secondary" onclick="openInteraction()" style="
    font-size: 24px;
    padding: 28px;
    min-height: 84px;
  ">INTERACT</button>
</div>

<div id="confirm" class="confirmation"></div>

<!-- PERSON MODAL -->
<div id="personModal" class="modal">
  <div class="modal-content">
    <h2>Create Person</h2>
    <input id="personName" placeholder="Name" style="font-size: 22px; padding: 16px; line-height: 1.5;">
    <select id="personPrivacy" style="font-size: 22px; padding: 16px; line-height: 1.5;">
      <option value="private_only">private_only</option>
      <option value="shared">shared</option>
    </select>
    <textarea id="personNotes" placeholder="Notes (optional)" style="font-size: 22px; padding: 16px; line-height: 1.5;"></textarea>
    <label style="font-size: 22px; padding: 16px; line-height: 1.5;"><input type="checkbox" id="personToRaw"> Also save intake to RAW</label>
    <div class="modal-actions">
      <button onclick="createPerson()" style="font-size: 22px; min-height: 64px;">Save</button>
      <button class="secondary" onclick="closeModals()" style="font-size: 22px; min-height: 64px;">Cancel</button>
    </div>
  </div>
</div>

<!-- INTERACTION MODAL -->
<div id="interactionModal" class="modal">
  <div class="modal-content">
    <h2>Log Interaction</h2>
    <select id="interactionPerson" style="font-size: 22px; padding: 16px; line-height: 1.5;"></select>
    <label style="font-size: 22px; padding: 16px; line-height: 1.5;"><input type="checkbox" id="newPersonToggle"> Create new person</label>
    <input id="newPersonName" placeholder="New person name" style="display:none; font-size: 22px; padding: 16px; line-height: 1.5;">
    <textarea id="interactionNotes" placeholder="Interaction notes" style="font-size: 22px; padding: 16px; line-height: 1.5;"></textarea>
    <label style="font-size: 22px; padding: 16px; line-height: 1.5;"><input type="checkbox" id="interactionToRaw"> Also save intake to RAW</label>
    <div class="modal-actions">
      <button onclick="saveInteraction()" style="font-size: 22px; min-height: 64px;">Save</button>
      <button class="secondary" onclick="closeModals()" style="font-size: 22px; min-height: 64px;">Cancel</button>
    </div>
  </div>
</div>

<script>
const input = document.getElementById('input');
const count = document.getElementById('count');
const confirmBox = document.getElementById('confirm');

input.addEventListener('input', () => count.textContent = input.value.length);

function notify(msg) {
  confirmBox.textContent = msg;
  confirmBox.style.display = 'block';
  setTimeout(() => confirmBox.style.display = 'none', 1200);
}

function saveRaw() {
  if (!input.value.trim()) return;
  google.script.run.createRawEntry(input.value);
  input.value = '';
  count.textContent = 0;
  notify('Saved to RAW');
}

function saveInbox() {
  if (!input.value.trim()) return;
  google.script.run.createInboxItem(input.value);
  input.value = '';
  count.textContent = 0;
  notify('Added to Inbox');
}

function openPerson() {
  document.getElementById('personModal').style.display = 'flex';
}

function openInteraction() {
  document.getElementById('interactionModal').style.display = 'flex';
  google.script.run.withSuccessHandler(p => {
    const sel = document.getElementById('interactionPerson');
    sel.innerHTML = '<option value="">Select person</option>';
    p.forEach(x => {
      const o = document.createElement('option');
      o.value = x.id;
      o.textContent = x.name;
      sel.appendChild(o);
    });
  }).listPeople();
}

function closeModals() {
  document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
}

function createPerson() {
  const name = document.getElementById('personName').value;
  if (!name) return;
  google.script.run.createPerson(
    name,
    document.getElementById('personPrivacy').value,
    document.getElementById('personNotes').value
  );
  if (document.getElementById('personToRaw').checked && input.value) {
    google.script.run.createRawEntry(input.value);
  }
  input.value = '';
  count.textContent = 0;
  closeModals();
  notify('Person created');
}

function saveInteraction() {
  const person = document.getElementById('interactionPerson').value;
  if (!person) return alert('Select or create a person');
  google.script.run.createInteraction(
    person,
    document.getElementById('interactionNotes').value,
    false,
    ''
  );
  if (document.getElementById('interactionToRaw').checked && input.value) {
    google.script.run.createRawEntry(input.value);
  }
  input.value = '';
  count.textContent = 0;
  closeModals();
  notify('Interaction saved');
}
</script>

</body>
</html>
