<!DOCTYPE html>
<html>
<head>
  <base target="_top">
</head>
<body>
  <textarea id="content" rows="4" style="width: 100%; padding: 5px; box-sizing: border-box; margin-bottom: 10px;"></textarea>
  <button type="button" onclick="addToInbox()" style="padding: 8px 16px;">Add to Inbox</button>

  <script>
    function addToInbox() {
      const content = document.getElementById('content').value;
      if (content.trim()) {
        google.script.run.createInboxItem(content);
        document.getElementById('content').value = '';
      }
    }
  </script>
</body>
</html>
