<!DOCTYPE html>
<html>
<head>
  <base target="_top">
</head>
<body>
  <form id="personForm">
    <div style="margin-bottom: 10px;">
      <label for="display_name">Name:</label><br>
      <input type="text" id="display_name" name="display_name" required style="width: 100%; padding: 5px;">
    </div>
    
    <div style="margin-bottom: 10px;">
      <label for="privacy_level">Privacy Level:</label><br>
      <select id="privacy_level" name="privacy_level" style="width: 100%; padding: 5px;">
        <option value="private_only">private_only</option>
        <option value="shared">shared</option>
      </select>
    </div>
    
    <div style="margin-bottom: 10px;">
      <label for="notes">Notes:</label><br>
      <textarea id="notes" name="notes" rows="4" style="width: 100%; padding: 5px;"></textarea>
    </div>
    
    <button type="submit" style="padding: 8px 16px;">Save</button>
  </form>

  <script>
    document.getElementById('personForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const displayName = document.getElementById('display_name').value;
      const privacyLevel = document.getElementById('privacy_level').value;
      const notes = document.getElementById('notes').value;
      
      google.script.run.createPerson(displayName, privacyLevel, notes);
      
      document.getElementById('personForm').reset();
    });
  </script>
</body>
</html>
