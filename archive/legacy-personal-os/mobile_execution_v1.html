<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Personal OS - Execution</title>
  <style>
    :root {
      font-size: 32px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    html, body {
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      font-size: 1rem !important;
      line-height: 1.5 !important;
      overflow-x: hidden;
    }

    button {
      font-size: 1rem !important;
    }

    .header, .view-title, h1, h2, .title {
      font-size: 1.1rem !important;
    }

    .counter, .helper {
      font-size: 0.9rem !important;
    }

    .header {
      height: 56px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-weight: 500;
      color: #666;
      flex-shrink: 0;
    }

    .header-title {
      flex: 1;
      text-align: center;
      font-size: 1.1rem !important;
    }

    .back-button {
      background: none;
      border: none;
      font-size: 1.1rem !important;
      color: #1a1a1a;
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      min-width: 80px;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    .task-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px 0;
    }

    .task-item {
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .task-content {
      font-size: 1rem !important;
      line-height: 1.6;
      color: #1a1a1a;
      margin-bottom: 16px;
    }

    .task-meta {
      font-size: 0.9rem !important;
      color: #666;
      margin-bottom: 12px;
    }

    .task-item.overdue {
      border-color: #dc2626;
      border-width: 2px;
    }

    .task-actions button.set-time,
    .task-actions button.set-recurrence {
      background: #666;
      color: #ffffff;
      font-size: 0.9rem !important;
      min-height: 60px !important;
      height: 60px !important;
      padding: 16px 20px !important;
    }

    .task-actions button.set-time:active,
    .task-actions button.set-recurrence:active {
      background: #555;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: #ffffff;
      border-radius: 16px;
      padding: 24px;
      max-width: 90%;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-content h3 {
      font-size: 1.1rem !important;
      margin-bottom: 20px;
      color: #1a1a1a;
    }

    .modal-content label {
      display: block;
      font-size: 1rem !important;
      margin-bottom: 8px;
      color: #1a1a1a;
    }

    .modal-content input,
    .modal-content select {
      width: 100%;
      font-size: 1rem !important;
      padding: 16px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .modal-actions button {
      flex: 1;
      min-height: 90px !important;
      height: 90px !important;
      font-size: 1rem !important;
      padding: 28px 24px !important;
      border: none;
      border-radius: 16px !important;
      cursor: pointer;
    }

    .modal-actions button.primary {
      background: #3a3a3a;
      color: #ffffff;
    }

    .modal-actions button.secondary {
      background: #666;
      color: #ffffff;
    }

    .task-actions {
      display: flex;
      gap: 12px;
    }

    .task-actions button {
      flex: 1;
      min-height: 90px !important;
      height: 90px !important;
      font-weight: 500;
      border: none;
      border-radius: 16px !important;
      cursor: pointer;
      padding: 28px 24px !important;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    .task-actions button.done {
      background: #3a3a3a;
      color: #ffffff;
    }

    .task-actions button.done:active {
      background: #2c2c2c;
    }

    .task-actions button.cancel {
      background: #666;
      color: #ffffff;
    }

    .task-actions button.cancel:active {
      background: #555;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #666;
      font-size: 1rem !important;
    }

    .section-header {
      font-size: 1.1rem !important;
      font-weight: 600;
      color: #1a1a1a;
      padding: 20px 16px 12px;
      margin-top: 8px;
    }

    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      background: #2c2c2c;
      color: #ffffff;
      padding: 16px 24px;
      border-radius: 12px;
      display: none;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .toast.show {
      display: block;
      animation: fadeInOut 1.2s;
    }

    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
      10% { opacity: 1; transform: translateX(-50%) translateY(0); }
      90% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
    }

    @media (min-width: 900px) {
      body {
        display: flex;
        justify-content: center;
        background: #f5f5f5;
      }

      .task-list {
        max-width: 720px;
        width: 100%;
        margin: 0 auto;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <button class="back-button" onclick="goToCapture()">Home</button>
    <div class="header-title">Execution</div>
    <div style="min-width: 80px;"></div>
  </div>
  <div class="task-list" id="task-list">
    <div class="empty-state">Loading...</div>
  </div>
  <div id="toast" class="toast"></div>

  <div id="time-modal" class="modal">
    <div class="modal-content">
      <h3>Set Time</h3>
      <label for="time-due-at">Due at</label>
      <input type="datetime-local" id="time-due-at">
      <label for="time-reminder">Reminder</label>
      <select id="time-reminder">
        <option value="none">none</option>
        <option value="at_due">at_due</option>
        <option value="minutes_before:15">minutes_before:15</option>
        <option value="hours_before:1">hours_before:1</option>
        <option value="day_of:09:00">day_of:09:00</option>
      </select>
      <div class="modal-actions">
        <button class="secondary" onclick="closeTimeModal()">Cancel</button>
        <button class="primary" onclick="saveTime()">Save</button>
      </div>
    </div>
  </div>

  <div id="recurrence-modal" class="modal">
    <div class="modal-content">
      <h3>Set Recurrence</h3>
      <label for="recurrence-rule">Recurrence</label>
      <select id="recurrence-rule">
        <option value="">none</option>
        <option value="daily">daily</option>
        <option value="weekly:0">weekly:sunday</option>
        <option value="weekly:1">weekly:monday</option>
        <option value="weekly:5">weekly:friday</option>
        <option value="monthly:1">monthly:1</option>
      </select>
      <div class="modal-actions">
        <button class="secondary" onclick="closeRecurrenceModal()">Cancel</button>
        <button class="primary" onclick="saveRecurrence()">Save</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzDnoBDowi3U_H3olPqPuLtO-bJaLoYrsjp4ZONdO9_6zim1ajZfQzYigDiY-EYTTba/exec";

    const taskList = document.getElementById('task-list');
    const toast = document.getElementById('toast');
    let currentTaskId = null;

    function goToCapture() {
      window.top.location.href = API_URL;
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 1200);
    }

    async function callApi(action, payload = {}) {
      const url = API_URL + `?api=1&action=${action}&payload=` + encodeURIComponent(JSON.stringify(payload));
      const res = await fetch(url);
      const data = await res.json();

      if (!res.ok || data.ok === false) {
        throw new Error(data.error || "API error");
      }

      return data;
    }

    async function loadTasks() {
      try {
        const data = await callApi("list_open_tasks", {});
        const tasks = Array.isArray(data) ? data : [];
        renderTasks(tasks);
      } catch (error) {
        taskList.innerHTML = '<div class="empty-state">Error loading tasks</div>';
      }
    }

    function renderTasks(tasks) {
      const commitments = tasks.filter(t => t.due_at);
      const actions = tasks.filter(t => !t.due_at);

      let commitmentsHtml = '<div class="section-header">COMMITMENTS</div>';
      if (commitments.length === 0) {
        commitmentsHtml += '<div class="empty-state" style="padding: 20px;">No commitments</div>';
      } else {
        commitmentsHtml += commitments.map(task => {
          const dueDate = new Date(task.due_at);
          const dueStr = dueDate.toLocaleString();
          const overdueClass = task.overdue ? ' overdue' : '';
          return `
            <div class="task-item${overdueClass}" data-task-id="${task.task_id}">
              <div class="task-content">${escapeHtml(task.content || '')}</div>
              <div class="task-meta">${escapeHtml(dueStr)}</div>
              <div class="task-actions">
                <button class="set-time" onclick="openTimeModal('${task.task_id}')">Set time</button>
                <button class="set-recurrence" onclick="openRecurrenceModal('${task.task_id}')">Set recurrence</button>
                <button class="done" onclick="completeTask('${task.task_id}')">Done</button>
                <button class="cancel" onclick="cancelTask('${task.task_id}')">Cancel</button>
              </div>
            </div>
          `;
        }).join('');
      }

      let actionsHtml = '<div class="section-header">ACTIONS</div>';
      if (actions.length === 0) {
        actionsHtml += '<div class="empty-state" style="padding: 20px;">No actions</div>';
      } else {
        actionsHtml += actions.map(task => `
          <div class="task-item" data-task-id="${task.task_id}">
            <div class="task-content">${escapeHtml(task.content || '')}</div>
            <div class="task-actions">
              <button class="set-time" onclick="openTimeModal('${task.task_id}')">Set time</button>
              <button class="set-recurrence" onclick="openRecurrenceModal('${task.task_id}')">Set recurrence</button>
              <button class="done" onclick="completeTask('${task.task_id}')">Done</button>
              <button class="cancel" onclick="cancelTask('${task.task_id}')">Cancel</button>
            </div>
          </div>
        `).join('');
      }

      taskList.innerHTML = commitmentsHtml + actionsHtml;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function completeTask(taskId) {
      try {
        await callApi("complete_task", { task_id: taskId });
        showToast("Task completed");
        await loadTasks();
      } catch (error) {
        showToast("Error: " + error.message);
      }
    }

    async function cancelTask(taskId) {
      try {
        await callApi("cancel_task", { task_id: taskId });
        showToast("Task canceled");
        await loadTasks();
      } catch (error) {
        showToast("Error: " + error.message);
      }
    }

    function openTimeModal(taskId) {
      currentTaskId = taskId;
      document.getElementById('time-modal').classList.add('show');
      document.getElementById('time-due-at').value = '';
      document.getElementById('time-reminder').value = 'none';
    }

    function closeTimeModal() {
      document.getElementById('time-modal').classList.remove('show');
      currentTaskId = null;
    }

    async function saveTime() {
      if (!currentTaskId) return;

      const dueAt = document.getElementById('time-due-at').value;
      const reminderRule = document.getElementById('time-reminder').value;

      if (!dueAt) {
        showToast("Due time required");
        return;
      }

      try {
        await callApi("set_task_timing", {
          task_id: currentTaskId,
          due_at: dueAt,
          reminder_rule: reminderRule
        });
        showToast("Time set");
        closeTimeModal();
        await loadTasks();
      } catch (error) {
        showToast("Error: " + error.message);
      }
    }

    function openRecurrenceModal(taskId) {
      currentTaskId = taskId;
      document.getElementById('recurrence-modal').classList.add('show');
      document.getElementById('recurrence-rule').value = '';
    }

    function closeRecurrenceModal() {
      document.getElementById('recurrence-modal').classList.remove('show');
      currentTaskId = null;
    }

    async function saveRecurrence() {
      if (!currentTaskId) return;

      const recurrenceRule = document.getElementById('recurrence-rule').value;

      try {
        await callApi("set_task_recurrence", {
          task_id: currentTaskId,
          recurrence_rule: recurrenceRule || 'none'
        });
        showToast("Recurrence set");
        closeRecurrenceModal();
        await loadTasks();
      } catch (error) {
        showToast("Error: " + error.message);
      }
    }

    loadTasks();
  </script>
</body>
</html>
